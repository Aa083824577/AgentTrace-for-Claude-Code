[project]
name = "agenttrace"
version = "0.1.0"
description = "Open-source observability and safety layer for Claude Code sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "brahim boughezroun " }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
agenttrace = "agenttrace.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"